<template id="tab-overview">
  <article class="writeup">
    <h2>The problem</h2>
    <p>Every World Cup, everyone has an opinion on who'll win — pundits, bookmakers, your group chat. Opinions are cheap and rarely scored afterwards. I wanted something better: <strong>honest probabilities</strong> that can be checked against what actually happens, and that <strong>update themselves</strong> as the tournament unfolds.</p>
    <p>So this isn't a hot take. It's a model that rates every national team from 150 years of match results, plays the entire 48-team tournament <strong>50,000 times</strong>, and counts how often each team lifts the trophy. Then — and this is the part that keeps it honest — it re-runs every morning on the real results as they come in.</p>

    <h2>Finding 1 — the favourites, in numbers</h2>
    <p>Before a ball is kicked, the model makes Argentina and Spain the clear front two, with Brazil, England, France and Portugal a tier below. No surprises — but now there's a number attached, not a vibe.</p>
    <img src="../assets/worldcup/title_odds.png" alt="Argentina ~21% and Spain ~17% lead the field, ahead of Brazil, England, France and Portugal." />
    <a class="deeper" href="#" onclick="document.querySelector('[data-tab=app]')?.click();return false;">Explore the live, interactive forecast →</a>

    <h2>Finding 2 — the model mostly agrees with the bookies, except where it doesn't</h2>
    <p>The betting market is a brutally good forecaster — thousands of people putting money on the line. A fair test of any model is: <em>does it just echo the market, or does it see something different?</em></p>
    <p>Mostly it agrees. But it rates <strong>Argentina well above</strong> the Australian market, and <strong>France and England below</strong> it. That's the signature of a model built purely on <em>results</em>: it loves Argentina's recent record, but it can't see the things humans price in — an ageing squad, a key injury, who's in form. The disagreement is the interesting bit, and I don't paper over it.</p>
    <p>One number worth knowing as a punter: the bookmakers' outright odds bake in a <strong>21% margin</strong>. Their "probabilities" add up to 121%, not 100% — that extra 21 points is the house edge, the same lesson as my <a class="deeper" href="#" onclick="window.location.href='blackjack.html';return false;">blackjack project</a>.</p>
    <img src="../assets/worldcup/model_vs_market.png" alt="Model agrees with the market on most teams but rates Argentina higher and France/England lower." />
    <a class="deeper" href="#" onclick="document.querySelector('[data-tab=technical]')?.click();return false;">How the model is built and tested →</a>

    <h2>What I built</h2>
    <ul>
      <li>A <strong>ratings model</strong> that learns each team's attacking and defensive strength from every men's international since 1872, weighting recent games far more heavily.</li>
      <li>A <strong>tournament simulator</strong> that plays the real 2026 format — 12 groups, the eight best third-placed teams, the exact knockout bracket — fifty thousand times.</li>
      <li>A <strong>daily auto-refresh</strong>: a free scheduled job pulls the latest results, fixes what's happened, and re-forecasts the rest. No servers, no cost, nothing to maintain.</li>
    </ul>

    <blockquote>The bottom line: a forecast you can actually hold to account. It's calibrated (when it says 30%, those things happen about 30% of the time), it's honest about where it disagrees with the market and why, and from 11 June it tells its own story as the results land.</blockquote>
  </article>

<!-- TECHNICAL: DS deep dive. Jargon fine. -->
<template id="tab-technical">
  <article class="writeup">
    <h2>Data &amp; framing</h2>
    <p>The training data is the <code>martj42</code> international-results set: <strong>49,291</strong> men's full internationals from 1872 to the eve of the tournament (results only — no friendlies excluded, but B-teams and youth sides are). The target isn't "who wins" directly; it's <strong>goals</strong>. Model the score and everything else — win/draw/loss, qualification, the trophy — falls out by simulation.</p>

    <h2>The ratings model — Dixon-Coles with time decay</h2>
    <p>Each team <em>i</em> gets an <strong>attack</strong> α<sub>i</sub> and a <strong>defence</strong> δ<sub>i</sub>. Expected goals for a match are Poisson with means</p>
    <pre><code class="lang-text">log μ_home = α_home − δ_away + h·(home advantage)
log μ_away = α_away − δ_home</code></pre>
    <p>On top of independent Poisson sits the <strong>Dixon-Coles correction</strong> (a parameter ρ) that fixes the well-known under-counting of 0-0, 1-0, 0-1 and 1-1 scorelines. Every historical match is weighted by <code>exp(−ξ · age)</code> with a ~2-year half-life, so the fit reflects the team that exists <em>now</em>, not the one from 1990 — this is the time-series heart of the thing. The whole model is fit by maximum likelihood (L-BFGS-B) with a small ridge penalty for stability.</p>
    <p>Two practical fixes that mattered:</p>
    <ul>
      <li><strong>Minimum-matches filter.</strong> The raw data includes non-FIFA and micro-teams whose handful of games against weak opposition produced nonsense ratings (Tibet, Yorkshire, Cascadia topping the table). Dropping teams with &lt;30 games in-window — iteratively, since dropping one thins its opponents — cleaned this up. The ratings then rank exactly as you'd expect: Argentina, Spain, Brazil, England, France.</li>
      <li><strong>Host advantage.</strong> The tournament is at neutral venues, so by default no one gets a home edge — which wrongly gave the USA a ~0% title chance. The fitted home-advantage term is now applied to the three hosts (USA, Canada, Mexico) in their own matches, lifting their qualification odds to a realistic 70–90%.</li>
    </ul>

    <h2>The simulator</h2>
    <p>One replication: simulate all 72 group matches from the goals model; rank each group on points, goal difference, goals scored; take the 12 winners, 12 runners-up and the <strong>8 best third-placed teams</strong>; assign those eight to their bracket slots respecting the official eligibility table (a constraint-satisfying match, since the exact permutation barely moves the odds); then play the exact <strong>Round-of-32 → final</strong> bracket, deciding drawn knockouts with a strength-weighted coin as a stand-in for extra time and penalties. Repeat 50,000 times and tally how far each team gets. Live results are injected by fixing any already-played scoreline before simulating the rest.</p>

    <h2>Does it actually work? — out-of-sample backtest</h2>
    <p>The only test that counts is on tournaments the model never saw. I refit using <em>only</em> data before each opening day and predicted every match of the <strong>2018</strong> and <strong>2022</strong> World Cups.</p>
    <img src="../assets/worldcup/calibration.png" alt="Reliability curve hugging the diagonal; out-of-sample log-loss 1.00 vs climatology 1.06." />
    <p>The model beats a climatology baseline (predicting the historical base rates every match) on log-loss in both years, and the reliability curve hugs the diagonal — when it says 30%, those outcomes happen about 30% of the time. It is, in the honest sense, <strong>well-calibrated</strong>. See the <a class="deeper" href="#" onclick="document.querySelector('[data-tab=results]')?.click();return false;">Results tab</a> for the full numbers.</p>

    <h2>Honest negatives &amp; caveats</h2>
    <p>The null results <em>are</em> findings, and the limits are real:</p>
    <ul>
      <li><strong>The edge over the baseline is modest</strong> (~0.06 nats of log-loss). International football is genuinely high-variance; single-match accuracy is ~53–58%. Anyone promising more is overfitting or lying.</li>
      <li><strong>The market beats the model on France and England.</strong> A pure results model can't see squad age, injuries, tactical change or form — exactly the things the market prices. The Argentina disagreement is the same coin's other face: the model over-trusts a strong recent record.</li>
      <li><strong>Goals only.</strong> No red cards, fatigue, travel, weather or "must-win" game-state effects. Knockout extra-time/penalties are a crude strength-weighted coin, not a shootout model.</li>
      <li><strong>The market snapshot is one moment in time</strong> and de-vigged proportionally (the simplest method); a sharper comparison would use the closing line across several books.</li>
    </ul>

    <h2>From prototype to production</h2>
    <p>What's live already: a free <strong>GitHub Action</strong> that pulls the open-data results feed each morning, conditions the simulation on completed matches and commits a fresh forecast — a static site with a self-updating brain and zero hosting cost. To take it further I'd add a <strong>player-availability layer</strong> (squad lists, a Golden-Boot model), <strong>multi-book closing odds</strong> for a proper market benchmark, and <strong>in-play re-forecasting</strong> during matches. The architecture already supports all three; they're scope, not redesign.</p>
  </article>

    <h3>Fitting the goals model (time-decayed Dixon-Coles)</h3>
    <pre><code class="lang-python">age_days = (asof - d["date"]).dt.days.to_numpy()
w = np.exp(-xi * age_days)                 # ~2-year half-life: recent games dominate

def negloglik(p):
    att, deff, ha, rho = unpack(p)
    log_mh = att[hi] - deff[ai] + np.where(neutral, 0.0, ha)
    log_ma = att[ai] - deff[hi]
    mh, ma = np.exp(log_mh), np.exp(log_ma)
    ll = hg*log_mh - mh + ag*log_ma - ma   # Poisson log-likelihood
    ll += np.log(_dc_tau(hg, ag, mh, ma, rho))   # Dixon-Coles low-score fix
    return -np.sum(w * ll) + reg*(att@att + deff@deff)   # weighted NLL + ridge</code></pre>
