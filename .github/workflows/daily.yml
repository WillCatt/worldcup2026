name: Daily forecast refresh

# Re-forecast every morning during the tournament: pull completed results from the
# openfootball feed, condition the simulation on them, and commit a fresh forecast.json.
# Free for public repos. If nothing changed (e.g. no new results), the commit is skipped.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-run forecast
        run: python -m src.update 50000

      - name: Commit updated forecast
        run: |
          git config user.name "worldcup-bot"
          git config user.email "actions@github.com"
          git add output/forecast.json
          if git diff --staged --quiet; then
            echo "No change in forecast."
          else
            git commit -m "Daily forecast refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
